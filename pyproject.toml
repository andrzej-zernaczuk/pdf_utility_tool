[project]
name = "pdf-utility-tool"
version = "0.1.0"
description = "Python PDF utility tool for merging and converting files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "groq>=0.9.0",
    "openai>=1.0.0",
    "pypdf>=4.0.0",
    "python-dotenv>=1.0.0",
    "screeninfo>=0.8.1",
]

[dependency-groups]
dev = [
    "mypy>=1.11.0",
    "pyinstaller>=6.22.2",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "BLE", "DTZ", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
